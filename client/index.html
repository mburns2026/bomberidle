<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bomber Idle</title>
    <style>
      :root { color-scheme: dark; --bg:#14210f; --panel:#1f3015; --bar:#3a2512; --accent:#e08a1e; --text:#f3e9c6; --muted:#a9b58f; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
      header { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 10px 16px; background: var(--bar); }
      header strong.title { font-size: 1.1rem; margin-right: auto; }
      .stat b { font-variant-numeric: tabular-nums; color: #ffe27a; }
      button { background: var(--accent); color: #1b1206; border: 0; padding: 8px 14px; border-radius: 4px; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
      button:disabled { opacity: .5; cursor: not-allowed; }
      button.ghost { background: transparent; color: var(--text); border: 1px solid var(--muted); width: 100%; margin-top: 12px; }
      main { display: flex; flex-wrap: wrap; gap: 14px; padding: 14px; align-items: flex-start; }
      #game { flex: 1 1 640px; min-width: 0; aspect-ratio: 29 / 17; max-width: 1100px; }
      aside { flex: 1 1 240px; max-width: 320px; background: var(--panel); padding: 14px; border-radius: 6px; }
      aside h2 { margin: 0 0 10px; font-size: 1rem; }
      ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
      .hero-top { display: flex; gap: 8px; align-items: center; }
      .hero-top .muted { margin-left: auto; }
      .dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
      .bar { height: 6px; background: #0e1709; border-radius: 3px; margin: 6px 0 4px; overflow: hidden; }
      .bar div { height: 100%; transition: width .3s; }
      .muted { color: var(--muted); } .small { font-size: .8rem; }
      .note { margin: 12px 0 0; color: var(--muted); font-size: .8rem; line-height: 1.4; }
      #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%) translateY(20px); background: #0e1709; border: 1px solid var(--accent); padding: 10px 16px; border-radius: 4px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
      #toast.show { opacity: 1; transform: translateX(-50%); }
      @media (prefers-reduced-motion: reduce) { .bar div, #toast { transition: none; } }
    </style>
  </head>
  <body>
    <header>
      <strong class="title">Bomber Idle <span class="muted small">v1.0</span></strong>
      <span class="stat">Pendente <b id="pending">0.00</b></span>
      <span class="stat">Baús <b id="chests">0</b></span>
      <button id="connect">Conectar carteira</button>
      <button id="claim" disabled>Sacar</button>
    </header>
    <main>
      <div id="game"></div>
      <aside>
        <h2>Heróis</h2>
        <ul id="heroes"></ul>
        <button id="refill" class="ghost">Recarregar stamina (teste)</button>
        <p class="note">Os pontos são de teste e ficam salvos só neste navegador. O saque on-chain depende do servidor e do programa na devnet.</p>
      </aside>
    </main>
    <div id="toast" role="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
